# Android Build Optimizations
android.enableJetifier=false
android.nonFinalResIds=false
android.nonTransitiveRClass=true
android.useAndroidX=true

# ===============================================
# GRADLE BUILD PERFORMANCE OPTIMIZATIONS
# ===============================================

# Increase memory allocation for Gradle daemon
# This significantly speeds up builds with large projects
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED

# Enable parallel execution of independent modules
org.gradle.parallel=true

# Enable Gradle build caching - reuses outputs from previous builds
org.gradle.caching=true

# Enable configuration caching for faster configuration phase
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# Watch file system for incremental builds (Gradle 6.5+)
org.gradle.vfs.watch=true

# Enabling daemon speeds up build as it keeps JVM warm between builds
org.gradle.daemon=true

# Kotlin specific optimizations
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.code.style=official


# Kapt optimizations (for annotation processing)
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# R8 optimization for release builds  
android.enableR8.fullMode=true

# File encoding
systemProp.file.encoding=utf-8
